<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的错题本 - AI 化学提分老师</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --accent: #f59e0b;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header {
            background: linear-gradient(135deg, var(--primary), #1e40af);
            color: white; padding: 16px 24px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(37,99,235,0.3);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
        .header-actions { display: flex; gap: 8px; }
        .header-btn {
            background: rgba(255,255,255,0.15); color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-size: 14px; text-decoration: none; transition: background 0.2s;
        }
        .header-btn:hover { background: rgba(255,255,255,0.25); }
        .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
        .page-title { font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .page-title span { font-size: 14px; color: var(--text-muted); font-weight: 400; }
        .empty-state { text-align: center; padding: 60px 20px; background: var(--card); border-radius: 16px; border: 1px solid var(--border); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { color: var(--text-muted); font-size: 15px; margin-bottom: 20px; }
        .question-list { display: flex; flex-direction: column; gap: 12px; }
        .question-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 18px 20px; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center; gap: 16px;
        }
        .question-card:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(37,99,235,0.1); transform: translateY(-1px); }
        .question-card-left { flex: 1; min-width: 0; }
        .question-card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .question-card-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; }
        .question-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .tag { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .question-card .arrow { font-size: 20px; color: var(--text-muted); flex-shrink: 0; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 8px; }
            .header-actions { width: 100%; justify-content: center; }
            .container { padding: 16px 12px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left"><div class="header-logo">📚 AI 化学错题本</div></div>
        <div class="header-actions">
            <a href="/" class="header-btn">🧪 返回讲解</a>
        </div>
    </header>
    <div class="container">
        <div class="page-title">📚 我的错题本 <span id="countLabel">(加载中...)</span></div>
        <div id="questionList"><div class="loading">加载中...</div></div>
    </div>
    <script>
        async function loadQuestions() {
            const listEl = document.getElementById('questionList');
            try {
                const res = await fetch('/api/wrong/list');
                const data = await res.json();
                const questions = data.questions || [];
                document.getElementById('countLabel').textContent = `(共 ${questions.length} 题)`;
                if (questions.length === 0) {
                    listEl.innerHTML = `<div class="empty-state"><div class="icon">📝</div><p>还没有加入错题，快去练习吧！</p><a href="/" class="header-btn" style="background:var(--primary);color:white;padding:10px 24px;border-radius:10px;display:inline-block;">去解题</a></div>`;
                    return;
                }
                listEl.innerHTML = '<div class="question-list">' + questions.map(q => {
                    const tagsHtml = q.tags ? q.tags.split(/[,，\/]/).filter(t => t.trim()).map(t => `<span class="tag">${t.trim()}</span>`).join('') : '';
                    const date = q.created_at ? new Date(q.created_at + 'Z').toLocaleDateString('zh-CN') : '';
                    return `<div class="question-card" onclick="window.location.href='/detail.html?id=${q.id}'"><div class="question-card-left"><div class="question-card-title">🧪 ${escapeHtml(q.question)}</div><div class="question-card-meta"><span>📅 ${date || '未知日期'}</span></div>${tagsHtml ? '<div class="question-card-tags">' + tagsHtml + '</div>' : ''}</div><div class="arrow">→</div></div>`;
                }).join('') + '</div>';
            } catch (err) {
                listEl.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>加载失败：${err.message}</p><button class="header-btn" onclick="loadQuestions()" style="background:var(--primary);color:white;padding:10px 24px;border-radius:10px;border:none;cursor:pointer;">重新加载</button></div>`;
            }
        }
        function escapeHtml(text) { if (!text) return ''; const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
        loadQuestions();
    </script>
</body>
</html>
